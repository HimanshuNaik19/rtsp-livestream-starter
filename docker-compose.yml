version: "3.9"
services:
  mongo:
    image: mongo:7
    restart: always
    ports: ["27017:27017"]
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      - MONGO_URI=mongodb://mongo:27017
      - MONGO_DB=rtsp_app
      - STREAM_DIR=static/streams/main
      - RTSP_URL=${RTSP_URL:-}
    volumes:
      - ./backend/static:/app/static
    ports:
      - "8000:8000"
    depends_on: [mongo]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      - VITE_API=http://localhost:8000
    depends_on: [backend]

volumes:
  mongo_data:
